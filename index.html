<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<title>MindLink ร้องกวาง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

/* Layout: app shell — top bar + tab rail, content in a 1180px column; reports render as A4 sheets */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef3f9; --ink:#132338; --muted:#5a6a80; --line:#dbe3ee;
  --accent:#1c5ea8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --ok:#1e8757; --ok-soft:#e1f3ea; --warn:#b8770f; --warn-soft:#fbf0dc; --bad:#c03a33; --bad-soft:#fbe4e2;
  --paper:#ffffff; --paper-ink:#111;
  --f-ui:"IBM Plex Sans Thai",system-ui,sans-serif; --f-doc:"Sarabun","TH Sarabun New",serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --surface:#152131; --surface-2:#1b2a3d; --ink:#e4ebf4; --muted:#93a3b8; --line:#26374c;
  --accent:#6aa8ec; --accent-ink:#0b1420; --accent-soft:#1c3350;
  --ok:#4cc38a; --ok-soft:#173b2c; --warn:#e3a846; --warn-soft:#3b2e17; --bad:#ef7a72; --bad-soft:#442221;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --surface:#152131; --surface-2:#1b2a3d; --ink:#e4ebf4; --muted:#93a3b8; --line:#26374c;
  --accent:#6aa8ec; --accent-ink:#0b1420; --accent-soft:#1c3350;
  --ok:#4cc38a; --ok-soft:#173b2c; --warn:#e3a846; --warn-soft:#3b2e17; --bad:#ef7a72; --bad-soft:#442221;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.mono{font-family:var(--f-mono);font-size:.9em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:16px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.brand h1{font-size:20px}
.brand p{margin:0;font-size:13px;color:var(--muted)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.demo{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.ver{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);text-align:center}
.ver-top{font-size:11px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}

/* Shell */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top-in .brand h1{font-size:16px}
.top-in .brand p{font-size:12px}
.top-in .logo{width:34px;height:34px;font-size:15px;border-radius:10px}
.spacer{flex:1}
.who{font-size:13px;display:flex;gap:8px;align-items:center}
.role{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.sample{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px;text-align:center}
main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;gap:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h2{font-size:20px}
.bar select,.bar input{width:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px}
.panel .sub{font-size:12.5px;color:var(--muted);margin:-6px 0 10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2,.grid2b{grid-template-columns:1fr}}
svg text{fill:var(--muted);font-family:var(--f-ui)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(100px,140px) 1fr 96px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;border-radius:99px}
.hbar .val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;letter-spacing:.02em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.P{background:var(--accent-soft);color:var(--accent)}
.chip.S{background:var(--warn-soft);color:var(--warn)}
.chip.D{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.wait{background:var(--surface-2);color:var(--muted)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

/* Today list */
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daybar .date{font-size:18px;font-weight:600;min-width:210px;text-align:center}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.rows{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.row.done{border-left-color:var(--ok)} .row.miss{border-left-color:var(--bad)} .row.pend{border-left-color:var(--accent)}
.row .who2{display:grid;gap:3px;min-width:0}
.row .nm{font-weight:600;font-size:15.5px}
.row .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.row .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row .act .btn{min-width:64px}
@media (max-width:640px){.row{grid-template-columns:1fr}.row .act{justify-content:flex-start}}

/* Follow-up */
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,20,35,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.modal h3{font-size:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.fl{display:grid;gap:6px}
.fl>span{font-size:13px;color:var(--muted);font-weight:500}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* Report paper */
.paper-wrap{overflow-x:auto;background:var(--surface-2);border-radius:var(--r);padding:20px}
.paper{width:210mm;min-height:297mm;margin:0 auto;background:var(--paper);color:var(--paper-ink);padding:18mm 16mm;font-family:var(--f-doc);font-size:14px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.paper h1{font-size:20px;text-align:center}
.paper .c{text-align:center}
.paper table{font-size:13px}
.paper th,.paper td{border:1px solid #999;padding:4px 6px;color:#111}
.paper th{background:#eef2f7;text-align:center;font-size:13px}
.paper .sumline{display:flex;gap:18px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.paper .sumline b{font-size:16px}
.paper .sign{display:flex;justify-content:flex-end;margin-top:36px}
.paper .sign div{text-align:center;line-height:2}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
@media print{header.top,.noprint{display:none!important}main{padding:0}.paper-wrap{padding:0;background:none}.paper{box-shadow:none;margin:0}}

.schema td:first-child{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.flow div{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px}
.flow b{display:block;font-size:13.5px;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){.row,.kpi{transition:border-color .2s}}

body{margin:0}
button.pv{all:unset;cursor:pointer;font-weight:inherit;color:inherit;border-bottom:1px dashed var(--muted)}
button.pv:hover{color:var(--accent);border-bottom-color:var(--accent)}
button.pv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pc-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.pc-sec h4{margin:0;font-size:14px;color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:13.5px}
.kv div span{display:block;font-size:11.5px;color:var(--muted)}
.hx{white-space:pre-wrap;font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:0}
details.vh{border-top:1px solid var(--line);padding:6px 0}
details.vh summary{cursor:pointer;font-size:13.5px}
details.wlbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
details.wlbox summary{cursor:pointer;font-weight:600;color:var(--accent)}
.chip.ck{cursor:pointer;padding:5px 9px;font-size:13px;display:inline-flex;gap:5px;align-items:center}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;font-size:15px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{opacity:.55;pointer-events:none}
.linkbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.linkbox a{color:var(--accent);font-weight:600}
@media print{body{background:#fff}.paper-wrap{overflow:visible}.paper{width:auto;min-height:0;padding:0}.note,#toast{display:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading" hidden><div><div class="spin"></div><span id="loadingText">กำลังโหลดข้อมูล…</span></div></div>

<div id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand"><div class="logo">ML</div><div><h1>MindLink ร้องกวาง</h1><p>ระบบติดตามผู้ป่วยจิตเวชและสารเสพติด · โรงพยาบาลร้องกวาง</p></div></div>
    <label class="f">รหัสเจ้าหน้าที่<input type="text" id="lgUser" placeholder="เช่น S001" autocapitalize="characters"></label>
    <label class="f">รหัสผ่าน<input type="password" id="lgPass"></label>
    <div class="err" id="lgErr"></div>
    <button class="btn primary" type="submit" id="lgBtn">เข้าสู่ระบบ</button>
    <div class="ver" id="verLogin"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><div class="logo">ML</div><div><h1>MindLink ร้องกวาง</h1><p>ติดตามผู้ป่วยจิตเวชและสารเสพติด · Telemed ฐาน รพ.สต.</p></div></div>
      <span class="ver-top" id="verTop"></span>
      <div class="spacer"></div>
      <div class="who"><span id="whoName"></span><span class="role" id="whoRole"></span>
        <button class="btn sm ghost" id="btnReload" title="โหลดข้อมูลล่าสุด">รีเฟรช</button>
        <button class="btn sm ghost" id="btnPw">เปลี่ยนรหัสผ่าน</button>
        <button class="btn sm ghost" id="logout">ออกจากระบบ</button></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>
<div id="modalRoot"></div>

<script>
/* ================= ตั้งค่า ================= */
const APP_VER='v1.2.0 (26 พ.ย. 69)';   // ต้องตรงกับ APP_VERSION ใน Code.gs
/* ⚙️ URL ของ web app (ลงท้าย /exec) จาก Deploy > Manage deployments — ใช้เมื่อวางไฟล์นี้บน GitHub Pages / server ของ IT */
const API_URL='https://script.google.com/macros/s/AKfycby2_hPbqyssdcwjrE5pC7PXCCU7PO-uny0CsZiRq_1RYRxnwJvui-gBsKwO6fr1LBZlxQ/exec';
const VIA_GAS=typeof google!=='undefined'&&!!(google.script&&google.script.run);
document.getElementById('verLogin').textContent='MindLink '+APP_VER;
document.getElementById('verTop').textContent=APP_VER;
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const s2d=s=>new Date(s+'T00:00:00Z');
const addDays=(s,n)=>{const d=s2d(s);d.setUTCDate(d.getUTCDate()+Math.round(n));return d.toISOString().slice(0,10)};
const dow=s=>s2d(s).getUTCDay();
const diffDays=(a,b)=>Math.round((s2d(b)-s2d(a))/864e5);
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TMF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const thDate=s=>{if(!okDate(s))return '–';const d=s2d(s);return d.getUTCDate()+' '+TM[d.getUTCMonth()]+' '+String(d.getUTCFullYear()+543).slice(2)};
const thDateFull=s=>{const d=s2d(s);return 'วัน'+TD[d.getUTCDay()]+'ที่ '+d.getUTCDate()+' '+TMF[d.getUTCMonth()]+' '+(d.getUTCFullYear()+543)};
const fyOf=s=>{const d=s2d(s);return d.getUTCFullYear()+543+(d.getUTCMonth()>=9?1:0)};
const fyMonth=s=>(s2d(s).getUTCMonth()+3)%12;
const FYM=['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
const FYMF=['ตุลาคม','พฤศจิกายน','ธันวาคม','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน'];
const pct=(a,b)=>b?Math.round(a*1000/b)/10:0;
const CH={tele:'Tele กับ พยบ.รพ.สต.',teleHome:'Tele กับ อสม. (ติดบ้าน/ติดเตียง)',outreach:'พยบ.จิตเวชออกหน่วย รพ.สต.',opd:'รพ.ร้องกวาง',prh:'รพ.แพร่ / อื่นๆ',home:'เยี่ยมบ้าน'};
const CHS={tele:'Tele รพ.สต.',teleHome:'Tele อสม.',outreach:'ออกหน่วย รพ.สต.',opd:'รพ.ร้องกวาง',prh:'รพ.แพร่/อื่นๆ',home:'เยี่ยมบ้าน'};
const CHK=['tele','teleHome','outreach','opd','prh'];
const isTele=c=>c==='tele'||c==='teleHome';
const atPcu=c=>isTele(c)||c==='outreach';
const chKey=l=>Object.keys(CH).find(k=>CH[k]===l);
const GRP={P:'จิตเวช',S:'สารเสพติด',D:'จิตเวช+สารเสพติด'};
const FU=['รอติดตาม','โทรแล้ว-ไม่รับสาย','ส่ง รพ.สต./อสม.ติดตาม','ติดต่อไม่ได้','ขอหยุดการรักษา','ย้ายที่อยู่/รักษาที่อื่น','รอติดตาม (ข้อมูลเดิม)'];
const CLOSED=['จำหน่าย','ย้าย/รักษาที่อื่น','เสียชีวิต'];

/* ================= server ================= */
/* เปิดจาก Apps Script → google.script.run · เปิดจาก server ภายนอก → fetch JSON API (ไม่ผูกบัญชี Google ในเบราว์เซอร์) */
function rawCall(fn,args){
  if(VIA_GAS)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error((e&&e.message)||String(e))))[fn](...args));
  if(/ใส่รหัส/.test(API_URL))return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ Index.html'));
  return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
    .catch(()=>{throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')})
    .then(r=>{if(!r.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด ('+r.status+')');return r.text()})
    .then(t=>{let o;try{o=JSON.parse(t)}catch(e){throw new Error('ระบบตอบกลับไม่ถูกต้อง — ตรวจสอบ API_URL และการ Deploy (Anyone)')}
      if(!o.ok)throw new Error(o.error||'เกิดข้อผิดพลาด');return o.data});
}
function call(fn,...args){
  return rawCall(fn,args).catch(e=>{
    const m=(e&&e.message)||String(e);
    if(/SESSION_EXPIRED/.test(m)){toast('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');doLogout(true);}
    throw new Error(m);
  });
}
const api=(fn,...args)=>call(fn,D.token,...args);
function loading(on,t){$('#loading').hidden=!on;if(t)$('#loadingText').textContent=t}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3000)}
function fail(e){toast('ไม่สำเร็จ: '+e.message)}

/* ================= login ================= */
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#lgErr').textContent='';$('#lgBtn').disabled=true;
  try{const r=await call('login',$('#lgUser').value,$('#lgPass').value);D.token=r.token;ss('ml_tk',r.token);
    if(r.mustChange)pwModal(true,$('#lgPass').value);else await boot();}
  catch(err){$('#lgErr').textContent=err.message}
  finally{$('#lgBtn').disabled=false}
});
async function boot(){
  loading(true,'กำลังโหลดข้อมูล…');
  try{
    const r=await api('bootstrap');
    const un=t=>t&&t.k?t.r.map(row=>{const o={};t.k.forEach((k,i)=>o[k]=row[i]);return o}):(t||[]);
    const ap=un(r.appts);ap.forEach(a=>{if(a.date){a.fy=String(fyOf(a.date));a.fym=String(fyMonth(a.date))}});
    const wl=un(r.wl);wl.forEach(w=>{if(w.date){w.fy=String(fyOf(w.date));w.fym=String(fyMonth(w.date))}});
    Object.assign(D,{smiv:un(r.smiv),patients:un(r.patients),appts:ap,wl,users:r.users||[],settings:r.settings,today:r.today,user:r.user});
    applySettings();index();
    if(!state.day){state.mine=D.patients.some(myPt);state.regN=state.mine?'mine':'all';state.day=D.today;state.fy=fyOf(D.today);state.rep.fy=state.fy;state.rep.day=nextTeleDay(D.today);}
    $('#login').hidden=true;$('#app').hidden=false;
    $('#whoName').textContent=D.user.name;$('#whoRole').textContent=D.user.role;
    render();
  }catch(e){ss('ml_tk',null);$('#login').hidden=false;$('#app').hidden=true;if(!/SESSION/.test(e.message))$('#lgErr').textContent=e.message}
  finally{loading(false)}
}

/* ================= derived ================= */
const done=a=>a.status==='มา'||a.status==='ขาด';
function pendingSet(){const s=new Set();D.appts.forEach(a=>{if(a.status==='นัด')s.add(a.hn)});return s}
function lastDone(){const m={};D.appts.forEach(a=>{if(done(a)&&(!m[a.hn]||m[a.hn].date<a.date))m[a.hn]=a});return m}
function pStatus(p,ld,pend){
  if(CLOSED.includes(p.status))return p.status;
  const l=ld[p.hn];
  if(pend.has(p.hn))return 'รักษาต่อเนื่อง';
  if(!l)return 'ไม่มีนัด';
  if(l.status==='ขาด')return diffDays(l.date,D.today)>=S.lostDays?'ขาดการรักษา':'ขาดนัด-รอติดตาม';
  return 'ไม่มีนัด';
}
function fuList(){
  const ld=lastDone(),pend=pendingSet();
  return Object.values(ld).filter(a=>a.status==='ขาด'&&!pend.has(a.hn)&&!CLOSED.includes(P(a.hn).status)).sort((a,b)=>a.date<b.date?-1:1);
}
function nextTeleDay(s){let x=addDays(s,1);for(let i=0;i<8&&!S.teleDays.includes(dow(x));i++)x=addDays(x,1);return x}

function fyOptions(sel){const cur=fyOf(D.today);const ys=new Set([cur,cur-1]);D.appts.forEach(a=>{if(a.fy)ys.add(+a.fy)});return [...ys].filter(y=>y>=cur-3&&y<=cur+1).sort((a,b)=>b-a).map(y=>`<option value="${y}" ${y===sel?'selected':''}>ปีงบ ${y}</option>`).join('')}
function vDash(){
  const fy=state.fy,m=state.month,ch=state.ch;

  const st={};D.patients.forEach(p=>{const s=pStatus(p,ld,pend);st[s]=(st[s]||0)+1});
  const active=D.patients.filter(p=>!CLOSED.includes(p.status)).length;

  const pts=new Set(sel.filter(a=>a.status==='มา').map(a=>a.hn)).size;

  const byPcu=PCUS.map(pc=>{const x=sel.filter(a=>atPcu(a.ch)&&P(a.hn).pcu===pc);const o=x.filter(a=>a.status==='มา').length;return{pc,n:x.length,o}}).filter(x=>x.n).sort((a,b)=>pct(b.o,b.n)-pct(a.o,a.n));
  const byCh=CHK.map(c=>{const x=sel.filter(a=>a.ch===c);return{c,n:x.length,o:x.filter(a=>a.status==='มา').length}});
  const byG=['P','S','D'].map(g=>{const x=sel.filter(a=>P(a.hn).g===g);return{g,n:x.length,o:x.filter(a=>a.status==='มา').length}});
  const fl=fuList();
  const period=m==='all'?`ปีงบประมาณ ${fy} (ต.ค. ${String(fy-1).slice(2)} – ก.ย. ${String(fy).slice(2)})`:`${FYMF[m]} ${+m<3?fy-1:fy}`;
  $('#main').innerHTML=`
  <div class="bar"><h2>Dashboard</h2><span class="muted">${period}</span><div class="spacer"></div>
    <select id="fFy" aria-label="ปีงบประมาณ">${fyOptions(fy)}</select>
    <select id="fM" aria-label="เดือน"><option value="all">ทั้งปีงบ</option>${FYMF.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select>
    <select id="fCh" aria-label="ช่องทาง"><option value="all">ทุกช่องทาง</option>${CHK.map(k=>`<option value="${k}">${CHS[k]}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi"><span class="l">ผู้ป่วยในทะเบียน</span><span class="v">${active}</span><span class="s">รักษาต่อเนื่อง ${st['รักษาต่อเนื่อง']||0} · ไม่มีนัด ${st['ไม่มีนัด']||0}</span></div>
    <div class="kpi"><span class="l">นัดที่ถึงกำหนด</span><span class="v">${sel.length.toLocaleString()}</span><span class="s">ผู้ป่วย ${pts} รายมารับบริการ</span></div>
    <div class="kpi ok"><span class="l">มาตามนัด</span><span class="v">${pct(att,sel.length)}%</span><span class="s">${att.toLocaleString()} ครั้ง</span></div>
    <div class="kpi bad"><span class="l">ขาดนัด</span><span class="v">${mis.toLocaleString()}</span><span class="s">${pct(mis,sel.length)}% ของนัด</span></div>
    <div class="kpi warn"><span class="l">ขาดการรักษา</span><span class="v">${st['ขาดการรักษา']||0}</span><span class="s">ขาดนัดเกิน ${S.lostDays} วัน ยังไม่กลับมา</span></div>
    <div class="kpi"><span class="l">Telemed (รพ.สต. + อสม.)</span><span class="v">${tele.toLocaleString()}</span><span class="s">ครั้งที่ให้บริการ</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><h3>นัดรายเดือน ปีงบ ${fy}</h3><p class="sub">ความสูงแท่ง = นัดที่ถึงกำหนด · ตัวเลขบนแท่ง = % มาตามนัด</p>${chartMonthly(monthly,m)}

      <div class="tw"><table><thead><tr><th>ผู้ป่วย</th><th>HN</th><th>กลุ่ม</th><th>รพ.สต.</th><th class="num">ขาด (วัน)</th></tr></thead><tbody>
      ${fl.slice(0,12).map(a=>{const p=P(a.hn),d=diffDays(a.date,D.today);return`<tr><td>${esc(maskName(p.name))}</td><td class="mono">${maskHN(p.hn)}</td><td><span class="chip ${p.g}">${GRP[p.g]||''}</span></td><td>${esc((p.pcu||'').replace('รพ.สต.',''))}</td><td class="num" style="color:${d>90?'var(--bad)':d>30?'var(--warn)':'var(--ink)'};font-weight:600">${d}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">ไม่มี</td></tr>'}
      </tbody></table></div></section>
  </div>`;
  $('#fM').value=m;$('#fCh').value=ch;
  $('#fFy').onchange=e=>{state.fy=+e.target.value;vDash()};
  $('#fM').onchange=e=>{state.month=e.target.value;vDash()};
  $('#fCh').onchange=e=>{state.ch=e.target.value;vDash()};

function cbar(label,n,max){return `<div class="hbar"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${max?Math.round(n*100/max):0}%;background:var(--accent)"></div></div><span class="val">${n.toLocaleString()}</span></div>`}
function wlDashHtml(){
  const L=D.wl.filter(w=>+w.fy===state.fy&&(state.month==='all'||+w.fym===+state.month));
  const by={},pt={},cl={};L.forEach(w=>{String(w.staff).split(/\s*,\s*/).filter(Boolean).forEach(n=>by[n]=(by[n]||0)+1);pt[w.point||'ไม่ระบุ']=(pt[w.point||'ไม่ระบุ']||0)+1;cl[w.clinic||'ไม่ระบุ']=(cl[w.clinic||'ไม่ระบุ']||0)+1});
  const srt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);const mx=o=>Math.max(1,...Object.values(o));
  return `<div class="grid2b"><section class="panel"><h3>Workload ${L.length.toLocaleString()} รายการ · ผู้ป่วย ${new Set(L.map(w=>w.hn)).size.toLocaleString()} ราย</h3><p class="sub">แยกเจ้าหน้าที่ (งานร่วมนับให้ทุกคน)</p>${srt(by).map(([k,v])=>cbar(k,v,mx(by))).join('')||'<p class="muted">ไม่มีข้อมูล</p>'}</section>
  <section class="panel"><h3>Workload แยกจุดให้บริการ</h3>${srt(pt).slice(0,8).map(([k,v])=>cbar(k,v,mx(pt))).join('')}<h3 style="margin-top:14px">แยกคลินิก</h3>${srt(cl).slice(0,8).map(([k,v])=>cbar(k,v,mx(cl))).join('')}</section></div>`;
}
function hbar(label,o,n){const r=pct(o,n);const c=r>=85?'var(--ok)':r>=70?'var(--warn)':'var(--bad)';
  return `<div class="hbar"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${r}%;background:${c}"></div></div><span class="val">${n?r+'%':'–'} <span class="muted" style="font-size:11px">(${n})</span></span></div>`}
function chartMonthly(data,sel){
  const W=680,H=250,L=36,B=26,T=22,cw=(W-L-8)/12;
  const max=Math.max(10,...data.map(d=>d.o+d.x));const step=max>150?50:max>60?20:10;const top=Math.ceil(max/step)*step;
  const y=v=>H-B-(v/top)*(H-B-T);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11">${v}</text>`;
  const bw=cw*.58;
  data.forEach((d,i)=>{const x=L+i*cw+(cw-bw)/2;const t=d.o+d.x;const dim=sel!=='all'&&+sel!==i?' opacity=".35"':'';
    if(t){g+=`<g${dim}><rect x="${x}" y="${y(d.o)}" width="${bw}" height="${y(0)-y(d.o)}" fill="var(--ok)" rx="2"/><rect x="${x}" y="${y(t)}" width="${bw}" height="${y(d.o)-y(t)}" fill="var(--bad)" rx="2"/>
      <text x="${x+bw/2}" y="${y(t)-6}" text-anchor="middle" font-size="10.5" style="fill:var(--ink)">${Math.round(d.o*100/t)}%</text></g>`}
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11">${FYM[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟนัดรายเดือน">${g}</svg>`;
}

  ${l.map(a=>{const p=P(a.hn),d=days(a),c=d>S.lostDays?'var(--bad)':d>30?'var(--warn)':'var(--accent)';const opts=FU.includes(a.fu)?FU:[a.fu||'รอติดตาม',...FU];

const vlOf=hn=>(D.smiv||[]).filter(v=>v.hn===hn).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.lid<b.lid?1:-1));
function logText(v){
  if(v.type==='ส่งต่อ')return `ส่งต่อ ${v.hosp||''}${v.reason?' · '+v.reason:''}`;
  if(v.type==='รับกลับ')return `รับกลับจาก ${v.hosp||''}${v.nextPlace?' · '+v.nextPlace:''}${okDate(v.nextDate)?' '+thDate(v.nextDate):''}`;
  if(v.type==='ติดตาม')return `${v.result||'ติดตาม'}${v.method?' ('+v.method+')':''}${v.result==='ติดตามไม่ได้'&&v.reason?' · '+v.reason:''}`;
  if(v.type==='ส่งเอกสารหน่วยงาน')return `ส่ง${v.docType||'เอกสาร'} → ${v.agencyName||v.agency||''}${v.docNo?' ที่ '+v.docNo:''}`;
  return v.note||v.type;
}
function smivData(){
  const ld=lastDone(),pend=pendingSet();
  const nextOf={},lastCome={};
  D.appts.forEach(a=>{if(a.status==='นัด'&&(!nextOf[a.hn]||a.date<nextOf[a.hn].date))nextOf[a.hn]=a;if(a.status==='มา'&&(!lastCome[a.hn]||a.date>lastCome[a.hn]))lastCome[a.hn]=a.date});
  const lastW={},wSm={};D.wl.forEach(w=>{if(!lastW[w.hn]||w.date>lastW[w.hn])lastW[w.hn]=w.date;if(w.clinic==='SMIV')wSm[w.hn]=1});
  const riskHn={};D.appts.forEach(a=>{if(a.status==='มา'&&a.risk==='มี')riskHn[a.hn]=1});
  const rows=D.patients.filter(p=>isSmiv(p)&&!CLOSED.includes(p.status)).map(p=>{
    const st=pStatus(p,ld,pend);const logs=vlOf(p.hn);
    const fol=logs.find(v=>v.type==='ติดตาม');const mv=logs.find(v=>v.type==='ส่งต่อ'||v.type==='รับกลับ');
    const atHosp=mv&&mv.type==='ส่งต่อ'?mv.hosp:'';
    const last=[lastCome[p.hn],lastW[p.hn],logs[0]&&logs[0].date].filter(Boolean).sort().pop()||'';

/* ================= ทะเบียน ================= */
function vReg(){
  const q=state.regQ.trim();const ld=lastDone(),pend=pendingSet();
  const nextOf={},lastOf={};D.appts.forEach(a=>{if(a.status==='นัด'&&(!nextOf[a.hn]||a.date<nextOf[a.hn]))nextOf[a.hn]=a.date;if(a.status==='มา'&&(!lastOf[a.hn]||a.date>lastOf[a.hn]))lastOf[a.hn]=a.date});
  let l=D.patients.map(p=>Object.assign({},p,{_st:pStatus(p,ld,pend)}));
  if(q)l=l.filter(p=>(p.name||'').includes(q)||p.hn.includes(q)||(p.pcu||'').includes(q)||(p.dx||'').toUpperCase().includes(q.toUpperCase()));
  if(state.regF!=='all')l=l.filter(p=>p._st===state.regF);
  if(state.regN==='mine')l=l.filter(myPt);else if(state.regN==='none')l=l.filter(p=>!p.nurse);else if(state.regN!=='all')l=l.filter(p=>p.nurse===state.regN);
  if(state.regC!=='all')l=l.filter(p=>(p.clinic||'')===state.regC);
  D.wl.forEach(w=>{if(!lastOf[w.hn]||w.date>lastOf[w.hn])lastOf[w.hn]=w.date});
  l.sort((a,b)=>(a.name||'').localeCompare(b.name||'','th'));
  const stc=s=>s==='รักษาต่อเนื่อง'?'ok':s==='ขาดการรักษา'?'bad':CLOSED.includes(s)?'wait':'warn';
  $('#main').innerHTML=`

    <select id="rn" aria-label="พยาบาลผู้ดูแล"><option value="mine">ผู้ป่วยของฉัน</option><option value="all">ทุกพยาบาล</option>${(D.users||[]).filter(u=>D.patients.some(p=>p.nurse===u.code)).map(u=>`<option value="${esc(u.code)}">${esc(u.name)}</option>`).join('')}<option value="none">ยังไม่ระบุผู้ดูแล</option></select>
    <select id="rc" aria-label="คลินิก"><option value="all">ทุกคลินิก</option>${WL.clinic.map(x=>`<option ${x===state.regC?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <input type="text" id="rq" placeholder="ค้นหา HN / ชื่อ / รพ.สต. / ICD-10" value="${esc(q)}" style="width:min(260px,100%)"><button class="btn primary sm" id="addP">+ ลงทะเบียนผู้ป่วยใหม่</button></div>
  <section class="panel"><div class="tw"><table><thead><tr><th>HN</th><th>ชื่อ-สกุล</th><th>กลุ่ม / Dx</th><th>คลินิก</th><th>พยาบาล</th><th>รพ.สต. ฐาน</th><th>มาล่าสุด</th><th>นัดถัดไป</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${l.slice(0,state.regLimit).map(p=>`<tr><td class="mono">${esc(p.hn)}</td><td><button type="button" class="pv" data-pv="${esc(p.hn)}">${esc(p.name)}</button></td><td><span class="chip ${p.g}">${GRP[p.g]||''}</span> <span class="muted" style="font-size:12px">${esc(p.icd)}</span></td><td>${p.clinic==='SMIV'?'<span class="pill bad">SMIV</span>':esc(p.clinic)}</td><td>${esc(nurseName(p.nurse))}</td><td>${esc(p.pcu)||'<span class="muted">–</span>'}</td><td>${thDate(lastOf[p.hn])}</td><td>${thDate(nextOf[p.hn])}</td><td><span class="pill ${stc(p._st)}">${p._st}</span></td>
    <td style="white-space:nowrap"><button class="btn sm ghost" data-ed="${esc(p.hn)}">แก้ไข</button>${!nextOf[p.hn]&&!CLOSED.includes(p.status)?`<button class="btn sm" data-ap="${esc(p.hn)}">นัด</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>${l.length>state.regLimit?`<div style="text-align:center;margin-top:10px"><button class="btn sm" id="more">แสดงเพิ่ม (${l.length-state.regLimit})</button></div>`:''}</section>`;
  const r=$('#rq');r.oninput=()=>{state.regQ=r.value;state.regLimit=50;const pos=r.selectionStart;vReg();const n=$('#rq');n.focus();n.setSelectionRange(pos,pos)};
  $('#rf').onchange=e=>{state.regF=e.target.value;vReg()};
  $('#rn').value=state.regN;$('#rn').onchange=e=>{state.regN=e.target.value;state.regLimit=50;vReg()};
  $('#rc').onchange=e=>{state.regC=e.target.value;state.regLimit=50;vReg()};
  $('#addP').onclick=()=>openPatientForm(null);
  if($('#more'))$('#more').onclick=()=>{state.regLimit+=100;vReg()};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const p=await api('getPatientFull',b.dataset.ed);openPatientForm(p)}catch(e){fail(e)}finally{b.disabled=false}});
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const hn=b.dataset.ap;
    modal(`<h3>สร้างนัด — ${esc(P(hn).name)}</h3><div class="fgrid"><label class="fl"><span>วันนัด</span><input type="date" id="apD" value="${snap(addDays(D.today,1))}"></label><div class="fl"><span>ช่องทาง</span>${seg('apc',[...CHK,'home'].map(k=>CH[k]),CH.tele)}</div></div>
    <div class="mfoot"><button class="btn ghost" id="mCancel">ยกเลิก</button><button class="btn primary" id="mSave">บันทึกนัด</button></div>`);
    $('#mCancel').onclick=closeM;$('#mSave').onclick=async()=>{const d=$('#apD').value;const ch=chKey(rv('apc'));
      try{const r=await api('newAppointment',{hn,date:d,ch});upsertAppt(r.appt);closeM();toast('สร้างนัด '+thDate(d)+' แล้ว');vReg()}catch(e){fail(e)}}});
}

/* ================= รายงาน ================= */
function buildReport(){
  const r=state.rep;const nm=p=>r.mask?maskName(p.name):p.name,hn=p=>r.mask?maskHN(p.hn):p.hn;
  const byPcu=a=>r.pcu==='all'||P(a.hn).pcu===r.pcu;
  const inFy=D.appts.filter(a=>done(a)&&+a.fy===r.fy&&(r.ch==='all'||a.ch===r.ch)&&byPcu(a));
  const sel=r.month==='all'?inFy:inFy.filter(a=>+a.fym===+r.month);
  const att=sel.filter(a=>a.status==='มา'),mis=sel.filter(a=>a.status==='ขาด');
  const per=r.month==='all'?`ปีงบประมาณ ${r.fy} (1 ตุลาคม ${r.fy-1} – 30 กันยายน ${r.fy})`:`เดือน${FYMF[r.month]} ${+r.month<3?r.fy-1:r.fy}`;
  const extra=[r.ch!=='all'?'ช่องทาง '+CHS[r.ch]:'',r.pcu!=='all'?r.pcu:''].filter(Boolean).join(' · ');
  const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
  const place=a=>atPcu(a.ch)?CHS[a.ch]+' '+(P(a.hn).pcu||'').replace('รพ.สต.',''):CHS[a.ch]||'';
  const sumLine=`นัดทั้งหมด ${sel.length} ครั้ง   มาตามนัด ${att.length} (${pct(att.length,sel.length)}%)   ขาดนัด ${mis.length} (${pct(mis.length,sel.length)}%)`;
  if(r.type==='attend')return{title:'รายงานผู้ป่วยที่มาตามนัด',lines:[per+(extra?' · '+extra:'')],summary:sumLine,
    headers:['ที่','วันที่','HN','ชื่อ-สกุล','กลุ่ม','ช่องทาง/สถานที่','การปรับยา','นัดครั้งถัดไป'],widths:[28,60,70,0,70,0,55,70],
    rows:att.sort(byDate).map((a,i)=>{const p=P(a.hn),nx=D.appts.find(x=>x.aid===a.nextAid);return[String(i+1),thDate(a.date),hn(p),nm(p),GRP[p.g]||'',place(a),a.med||'',nextTxt(a)]})};
  if(r.type==='miss')return{title:'รายงานผู้ป่วยที่ขาดนัด',lines:[per+(extra?' · '+extra:'')],summary:sumLine,
    headers:['ที่','วันที่นัด','HN','ชื่อ-สกุล','กลุ่ม','รพ.สต. ฐาน','ผลการติดตาม'],widths:[28,60,70,0,70,0,0],
    rows:mis.sort(byDate).map((a,i)=>{const p=P(a.hn);return[String(i+1),thDate(a.date),hn(p),nm(p),GRP[p.g]||'',(p.pcu||'').replace('รพ.สต.',''),a.fu||'']})};
  if(r.type==='smiv'){
    const {rows}=smivData();const L=rows.filter(x=>r.pcu==='all'||x.p.pcu===r.pcu);
    return{title:'ทะเบียนผู้ป่วย SMIV และสถานะการติดตาม',lines:['ข้อมูล ณ '+thDateFull(D.today)],
      summary:`ผู้ป่วย SMIV ${L.length} ราย · ต้องติดตาม ${L.filter(x=>x.alert).length} · ติดตามไม่ได้ ${L.filter(x=>x.lost).length} · อยู่ระหว่างส่งต่อ ${L.filter(x=>x.atHosp).length}`,
      headers:['ที่','HN','ชื่อ-สกุล','ประเภท','พยาบาล','สถานะล่าสุด','ติดตาม','นัดถัดไป'],widths:[24,62,110,90,70,0,55,70],
      rows:L.map((x,i)=>{const lg=x.logs[0];return[String(i+1),hn(x.p),nm(x.p),x.p.smivType||'',nurseName(x.p.nurse),lg?thDate(lg.date)+' '+logText(lg):x.st,x.fol?(x.lost?'ไม่ได้ ':'ได้ ')+thDate(x.fol.date):'',x.nx?thDate(x.nx.date):'']})};
  }
  if(r.type==='smivlog'){
    let L=(D.smiv||[]).filter(v=>fyOf(v.date)===r.fy&&(r.month==='all'||fyMonth(v.date)===+r.month)).sort((a,b)=>a.date<b.date?-1:1);
    const per=r.month==='all'?`ปีงบประมาณ ${r.fy}`:`เดือน${FYMF[r.month]} ${+r.month<3?r.fy-1:r.fy}`;const c={};L.forEach(v=>c[v.type]=(c[v.type]||0)+1);
    return{title:'บันทึกการส่งต่อ / รับกลับ / ติดตาม / ส่งเอกสาร ผู้ป่วย SMIV',lines:[per],summary:Object.entries(c).map(([k,v])=>k+' '+v).join(' · ')||'ไม่มีรายการ',
      headers:['ที่','วันที่','HN','ชื่อ-สกุล','ประเภท','รายละเอียด','ผู้บันทึก'],widths:[24,58,62,105,70,0,70],
      rows:L.map((v,i)=>{const p=P(v.hn);return[String(i+1),thDate(v.date),hn(p),nm(p),v.type,logText(v)+(v.meds?' · ยาใหม่: '+v.meds:'')+(v.plan?' · แผน: '+v.plan:'')+(v.note?' · '+v.note:''),nurseName(v.by)||v.by]})};
  }
  if(r.type==='wl'){
    const L=D.wl.filter(w=>+w.fy===r.fy);const names=[...new Set([...staffList(),...L.flatMap(w=>String(w.staff).split(/\s*,\s*/))])].filter(Boolean);
    const rows=FYMF.map((m,i)=>{const x=L.filter(w=>+w.fym===i);return[m,...names.map(n=>String(x.filter(w=>String(w.staff).split(/\s*,\s*/).includes(n)).length)),String(x.length),String(new Set(x.map(w=>w.hn)).size)]});
    rows.push(['รวม',...names.map(n=>String(L.filter(w=>String(w.staff).split(/\s*,\s*/).includes(n)).length)),String(L.length),String(new Set(L.map(w=>w.hn)).size)]);
    const pts={};L.forEach(w=>pts[w.point||'ไม่ระบุ']=(pts[w.point||'ไม่ระบุ']||0)+1);
    return{title:'สรุป Workload รายเดือน แยกเจ้าหน้าที่',lines:[`ปีงบประมาณ ${r.fy}`],summary:'จุดให้บริการ: '+Object.entries(pts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(' · '),
      headers:['เดือน',...names,'รวม (ครั้ง)','ผู้ป่วย (ราย)'],widths:[],rows};
  }
  if(r.type==='wllist'){
    let L=D.wl.filter(w=>+w.fy===r.fy&&(r.month==='all'||+w.fym===+r.month));
    if(r.staff!=='all')L=L.filter(w=>String(w.staff).split(/\s*,\s*/).includes(r.staff));
    L.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

/* ดาวน์โหลดรายงานเป็น Excel (.xlsx) — สร้างในเบราว์เซอร์ด้วย SheetJS (โหลดเมื่อกดครั้งแรก) */
function loadXlsxLib(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('โหลดตัวสร้าง Excel ไม่ได้ ตรวจการเชื่อมต่ออินเทอร์เน็ต'));document.head.appendChild(sc)})}
async function exportXlsx(R){
  const b=$('#bXlsx');b.disabled=true;
  try{
    await loadXlsxLib();
    const txtCol=R.headers.map(h=>/HN|โทร|CID|เลขที่/.test(h));
    const cell=(c,j)=>{c=c==null?'':String(c);return !txtCol[j]&&/^-?(0|[1-9]\d*)(\.\d+)?$/.test(c)&&c.length<12?Number(c):c};
    const top=[[R.title],[(D.settings.clinic||'')+' '+(D.settings.hospital||'')],...R.lines.map(l=>[l])];
    if(R.summary)top.push([R.summary]);top.push([]);
    const aoa=top.concat([R.headers],R.rows.map(r=>r.map(cell)));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    // HN / เบอร์โทร เก็บเป็นข้อความ (เลข 0 นำหน้าไม่หาย)
    const h0=top.length;R.rows.forEach((r,i)=>r.forEach((c,j)=>{if(txtCol[j]){const ref=XLSX.utils.encode_cell({r:h0+1+i,c:j});if(ws[ref])ws[ref].t='s'}}));
    ws['!cols']=R.headers.map((h,j)=>({wch:Math.min(50,Math.max(String(h).length,...R.rows.map(r=>String(r[j]==null?'':r[j]).length))+2)}));
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:h0,c:0},e:{r:h0+Math.max(R.rows.length,1),c:R.headers.length-1}})};
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'รายงาน');
    const name=(R.title+' '+(R.lines[0]||'')).replace(/[\\/:*?"<>|\[\]]/g,' ').replace(/\s+/g,' ').trim().slice(0,90)+'.xlsx';
    const b64=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
    const href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+b64;
    const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();
    $('#pdfLink').innerHTML=`<a href="${href}" download="${esc(name)}">ถ้าไฟล์ไม่ดาวน์โหลดเอง กดที่นี่: ${esc(name)}</a>`;
    toast('ดาวน์โหลด Excel แล้ว');
  }catch(e){fail(e)}finally{b.disabled=false}
}

function kv(pairs){return `<div class="kv">${pairs.filter(x=>x[1]!==undefined&&x[1]!==null&&String(x[1]).trim()!=='').map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}</div>`}
function visitKv(a){return kv([['วันที่',thDate(a.date)],['ช่องทาง',CHS[a.ch]||a.ch],['ผล',a.status+(a.rel==='TRUE'?' (ญาติรับยาแทน)':'')],['BP',a.bp],['P',a.pr],['BW',a.bw],['2Q',a.q2],['9Q',a.q9],['8Q',a.q8],
  ['อาการทางจิต',a.sym],['ผลการรักษา',a.ctl],['การกินยา',a.adh],['สารเสพติด/สุรา',a.sub&&a.sub!=='-'?a.sub:''],['SMI-V',a.risk],['การปรับยา',a.med],['รายละเอียดปรับยา',a.medDetail],['การจ่ายยา',a.disp],['ค่าส่งยา',a.fee],
  ['ผลติดตาม (ขาดนัด)',a.status==='ขาด'?a.fu:''],['นัดต่อ',noNx(a)?a.fu:a.next?thDate(a.next):'']])+(a.note?`<p class="hx">${esc(a.note)}</p>`:'')}
async function patientCard(hn){
  let p=P(hn);
  try{loading(true,'กำลังเปิดข้อมูลผู้ป่วย…');const f=await api('getPatientFull',hn);if(f)p=Object.assign({},p,f)}catch(e){}finally{loading(false)}
  const ap=D.appts.filter(a=>a.hn===hn).sort((a,b)=>a.date<b.date?1:-1);
  const lastV=ap.find(a=>a.status==='มา'),lastAny=ap.find(a=>a.status==='มา'||a.status==='ขาด');
  const nx=ap.filter(a=>a.status==='นัด').sort((a,b)=>a.date<b.date?-1:1)[0];
  const st=pStatus(p,lastDone(),pendingSet());
  const logs=vlOf(hn);const lastOf=t=>logs.find(v=>v.type===t);
  const wls=D.wl.filter(w=>w.hn===hn).sort((a,b)=>a.date<b.date?1:-1);
  const hist=[...ap.filter(a=>a.status==='มา'||a.status==='ขาด').map(a=>({d:a.date,a})),...wls.filter(w=>!w.aid).map(w=>({d:w.date,w}))].sort((x,y)=>x.d<y.d?1:-1).slice(0,20);
  modal(`<h3>${esc(p.name)} <span class="chip ${p.g}">${GRP[p.g]||''}</span>${isSmiv(p)?' <span class="pill bad" style="font-size:11px">SMIV</span>':''} <span class="pill ${st==='รักษาต่อเนื่อง'?'ok':st==='ขาดการรักษา'?'bad':'warn'}" style="font-size:11px">${esc(st)}</span></h3>
  <div class="bar"><button class="btn sm" id="pcEd">แก้ไขข้อมูล</button>${nx?'':'<button class="btn sm" id="pcAp">สร้างนัด</button>'}<button class="btn sm" id="pcWl">บันทึกงานอื่น</button>${isSmiv(p)?'<button class="btn sm primary" id="pcSm">+ บันทึก SMIV</button><button class="btn sm" id="pcSh">ประวัติ SMIV</button>':''}<span class="spacer"></span><button class="btn sm ghost" id="mCancel">ปิด</button></div>
  <div class="pc-sec"><h4>ข้อมูลผู้ป่วย</h4>${kv([['HN',p.hn],['อายุ',ageOf(p.dob)!==''?ageOf(p.dob)+' ปี':''],['เพศ',p.sex],['ICD-10',p.icd],['โรคประจำตัว',p.dx],['คลินิก',p.clinic],['ประเภท SMIV',isSmiv(p)?p.smivType:''],
    ['พยาบาลผู้ดูแล',nurseName(p.nurse)],['รพ.สต.ฐาน',p.pcu],['สิทธิ์',p.right],['โทร',p.phone],['ผู้ดูแล/เบอร์อื่น',p.caregiver],['แพ้ยา',p.allergy],['ที่อยู่',p.addr],['ที่อยู่ส่งยา',p.shipAddr],['หมายเหตุ',p.remark]])}
    ${p.meds?`<div style="font-size:12px;color:var(--muted)">ยาที่ใช้ (ทะเบียน)</div><p class="hx">${esc(p.meds)}</p>`:''}</div>
  <div class="pc-sec"><h4>นัดถัดไป</h4>${nx?kv([['วันนัด',thDateFull(nx.date)],['ช่องทาง',CH[nx.ch]||nx.ch]]):(noNx(lastAny)?`<span class="pill warn">${esc(lastAny.fu)}</span> <span class="muted" style="font-size:12px">บันทึก ${thDate(lastAny.date)}</span>`:'<span class="muted">ยังไม่มีนัดในระบบ</span>')}</div>
  <div class="pc-sec"><h4>การรับบริการล่าสุด${lastV?' — '+thDate(lastV.date):''}</h4>${lastV?visitKv(lastV)+'<button class="btn sm ghost" id="pcHos" style="justify-self:start">ดูข้อความที่บันทึกลง HosXP</button><div id="pcHosT"></div>':'<span class="muted">ยังไม่มีบันทึกการมารับบริการ</span>'}
    ${lastAny&&lastAny!==lastV&&lastAny.status==='ขาด'?`<div style="font-size:13px;color:var(--bad)">ขาดนัดล่าสุด ${thDate(lastAny.date)}${lastAny.fu?' · '+esc(lastAny.fu):''}</div>`:''}</div>
  ${isSmiv(p)||logs.length?`<div class="pc-sec"><h4>SMIV ล่าสุด</h4>${['ส่งต่อ','รับกลับ','ติดตาม','ส่งเอกสารหน่วยงาน'].map(t=>{const v=lastOf(t);return v?`<div style="font-size:13.5px"><b>${esc(t)}</b> ${thDate(v.date)} — ${esc(logText(v))}${v.meds?`<div><b>ยาใหม่:</b> ${esc(v.meds)}</div>`:''}${v.plan?`<div><b>แผนการรักษา:</b> ${esc(v.plan)}</div>`:''}${v.note?`<div class="muted">${esc(v.note)}</div>`:''}</div>`:''}).join('')||'<span class="muted">ยังไม่มีบันทึก SMIV</span>'}</div>`:''}
  <div class="pc-sec"><h4>ประวัติการรับบริการ (${hist.length} รายการล่าสุด) — กดเพื่อดูรายละเอียด</h4>
    ${hist.map(h=>h.a?`<details class="vh"><summary>${thDate(h.d)} · นัด ${esc(CHS[h.a.ch]||'')} — <b style="color:${h.a.status==='มา'?'var(--ok)':'var(--bad)'}">${esc(h.a.status)}</b>${h.a.med&&h.a.med!=='Remed'?' · '+esc(h.a.med):''}${h.a.risk==='มี'?' · <b style="color:var(--bad)">SMI-V</b>':''}</summary>${visitKv(h.a)}
      ${(()=>{const w=wls.find(x=>x.aid===h.a.aid);return w?`<div style="font-size:12.5px;color:var(--muted)">Workload: ${esc([w.point,w.clinic,w.assess,w.counsel,w.duration,w.staff].filter(Boolean).join(' · '))}</div>`:''})()}</details>`
      :`<details class="vh"><summary>${thDate(h.d)} · Workload ${esc(h.w.point)} · ${esc(h.w.clinic)}</summary>${kv([['ประเมิน',h.w.assess],['ให้คำปรึกษา',h.w.counsel],['เยี่ยมบ้าน',h.w.homevisit],['ประสานส่งต่อ',h.w.refer],['ระยะเวลา',h.w.duration],['ความรุนแรง',h.w.severity],['เจ้าหน้าที่',h.w.staff],['หัตถการ',h.w.proc],['หมายเหตุ',h.w.note]])}</details>`).join('')||'<span class="muted">ไม่มีประวัติในปีงบนี้และปีก่อน</span>'}</div>`);
  $('#mCancel').onclick=closeM;
  $('#pcEd').onclick=()=>openPatientForm(p);
  if($('#pcAp'))$('#pcAp').onclick=()=>apptModal(hn,()=>render());
  $('#pcWl').onclick=()=>wlModalFor(hn,Object.assign(wlDefault(p,'opd',D.today),{point:'โทรศัพท์'}));
  if($('#pcSm'))$('#pcSm').onclick=()=>smivLogModal(hn);
  if($('#pcSh'))$('#pcSh').onclick=()=>smivHistory(hn);
  if($('#pcHos'))$('#pcHos').onclick=async()=>{const b=$('#pcHos');b.disabled=true;try{const t=await api('getVisitText',lastV.aid);$('#pcHosT').innerHTML=t?`<p class="hx">${esc(t)}</p>`:'<span class="muted">ไม่มีข้อความที่บันทึกไว้</span>';b.hidden=true}catch(e){b.disabled=false;fail(e)}};
}

/* ================= start ================= */
(function(){const t=ss('ml_tk');if(t){D.token=t;boot()}})();
</script>
</body>
